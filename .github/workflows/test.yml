name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        # 2.6 ships with macOS and is the floor we support.
        # 3.4 is what most developers have installed.
        ruby: ['2.6', '3.4']

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Syntax
        run: find plugin lib -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      # The menu-bar host executes EVERY file in its plugin folder, so a
      # second file there would show up as a broken extra icon. This has
      # already happened once, with README.md.
      - name: Plugin folder holds exactly one file
        run: |
          count=$(find plugin -type f | wc -l | tr -d ' ')
          test "$count" = "1" || { echo "plugin/ has $count files, expected 1"; find plugin -type f; exit 1; }

      # Methods newer than the floor pass the linter and pass on 3.4;
      # only loading the library on 2.6 catches them. filter_map got
      # through this way.
      - name: Library loads and runs on this Ruby
        run: |
          ruby -e 'require "./lib/blackout"
                   abort "telegram" if telegram_posts(%q{<div class="tgme_widget_message" data-post="a/1"><div class="tgme_widget_message_text">x</div></div>}).empty?
                   abort "operator" unless parse_outage_text("1.1 12:00 - 14:00")["1.1"] == [13, 14]
                   abort "schedule" unless valid_schedule?(as_operator_schedule({ Date.today => { "1.1" => [13] } }, Time.now))
                   abort "safe" unless safe("a | b") == "a b"'

      - name: Tests
        run: ruby test/test_blackout.rb

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: RuboCop
        run: |
          gem install rubocop --no-document
          rubocop plugin/ lib/ test/ --format simple
